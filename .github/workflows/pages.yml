name: Publish bot game
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "shared/**"
      - "offline.html"
      - "offline/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.json"
      - "vite.offline.config.ts"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
