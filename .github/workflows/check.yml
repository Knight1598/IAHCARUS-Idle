name: Validate game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:render
      - run: npm run build:offline
      - run: npm run test:offline
      - run: npm run test:title
      - run: npm run test:daily
      - run: npm run test:tactics
      - run: npm run test:ui-addons
      - run: npm run test:special
      - run: npm run test:modes
      - run: npm run test:player
      - run: npm run test:hud
      - run: npm run test:army
      - run: npm run test:audio
      - run: npm run test:audio-addon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
